<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Ricettario personale: ricette divise per categorie con valori nutrizionali.">
  <meta name="theme-color" content="#eef0f6" id="theme-color">
  <script>
    // Applica il tema salvato prima di disegnare la pagina (evita il "lampo" di colore)
    (function () {
      var t;
      try { t = localStorage.getItem('ricettario:theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      document.getElementById('theme-color').content = t === 'dark' ? '#131313' : '#eef0f6';
    })();
  </script>

  <!-- iPhone: si comporta come un'app quando aggiunta alla schermata Home -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ricettario">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Scarica tutti i moduli JS in parallelo: l'app parte prima -->
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/images.js">
  <link rel="modulepreload" href="js/nutrition.js">
  <link rel="preload" href="icons/apple-touch-icon.png" as="image">

  <!-- Stile della schermata di caricamento: qui dentro così compare subito,
       senza aspettare il file CSS -->
  <style>
    #splash {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      background: #eef0f6;
      transition: opacity .35s ease, visibility .35s;
    }
    [data-theme="dark"] #splash { background: #131313; }
    #splash.hide { opacity: 0; visibility: hidden; }
    .splash-logo {
      width: 92px; height: 92px; border-radius: 22px;
      box-shadow: 0 12px 30px rgba(15, 157, 138, .3);
      animation: splash-in .5s cubic-bezier(.2, .9, .3, 1.2) both;
    }
    .splash-spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(15, 157, 138, .18); border-top-color: #0f9d8a;
      animation: splash-spin .8s linear infinite;
    }
    [data-theme="dark"] .splash-spinner { border-color: rgba(31, 184, 162, .2); border-top-color: #1fb8a2; }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @keyframes splash-in { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
    /* Finché l'app si carica resta visibile solo la schermata di caricamento
       (pagina, pulsante +, barra in alto e menu in basso compaiono dopo) */
    body.loading .view, body.loading .navbar, body.loading .tabbar, body.loading .fab { visibility: hidden; }
  </style>

  <link rel="stylesheet" href="css/style.css">
  <title>Ricettario</title>
</head>
<body class="loading">
  <!-- Schermata di caricamento: sparisce appena l'app è pronta (vedi app.js) -->
  <div id="splash" role="status" aria-label="Caricamento">
    <img class="splash-logo" src="icons/apple-touch-icon.png" alt="">
    <div class="splash-spinner"></div>
  </div>

  <!-- Sfondo sfumato che dà profondità all'effetto vetro -->
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  </div>

  <header class="navbar" id="navbar">
    <div class="nav-side" id="nav-left"></div>
    <div class="nav-title" id="nav-title"></div>
    <div class="nav-side right" id="nav-right"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar glass" id="tabbar" aria-label="Sezioni"></nav>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
