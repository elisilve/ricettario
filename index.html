<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Ricettario personale: ricette divise per categorie con valori nutrizionali.">
  <meta name="theme-color" content="#eef0f6" id="theme-color">
  <script>
    // Applica il tema salvato prima di disegnare la pagina (evita il "lampo" di colore)
    (function () {
      var t;
      try { t = localStorage.getItem('ricettario:theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      document.getElementById('theme-color').content = t === 'dark' ? '#131313' : '#eef0f6';
    })();
  </script>

  <!-- iPhone: si comporta come un'app quando aggiunta alla schermata Home -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ricettario">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="stylesheet" href="css/style.css">
  <title>Ricettario</title>
</head>
<body>
  <!-- Sfondo sfumato che dà profondità all'effetto vetro -->
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  </div>

  <header class="navbar" id="navbar">
    <div class="nav-side" id="nav-left"></div>
    <div class="nav-title" id="nav-title"></div>
    <div class="nav-side right" id="nav-right"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar glass" id="tabbar" aria-label="Sezioni"></nav>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
